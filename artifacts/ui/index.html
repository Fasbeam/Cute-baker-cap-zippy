<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CUE-PRO · Cute Trader Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cute: {
              pink: '#ff8fb1',
              lavender: '#c4b5fd',
              mint: '#6ee7b7',
              cream: '#fff7ed',
              ink: '#1e1b4b'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background: linear-gradient(135deg, #fff7ed 0%, #f5f3ff 50%, #ecfdf5 100%); }
    .card-shadow { box-shadow: 0 10px 25px -5px rgba(196, 181, 253, 0.3); }
  </style>
</head>
<body class="min-h-screen text-cute-ink font-sans">
  <div class="max-w-6xl mx-auto p-4 md:p-6">
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center md:justify-between mb-6">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">
          <span class="text-cute-pink">CUE</span><span class="text-cute-lavender">-PRO</span>
        </h1>
        <p class="text-sm text-slate-600">Silence is a recommendation · Defined-risk only</p>
      </div>
      <div class="mt-3 md:mt-0 flex gap-2">
        <select id="symbol" class="rounded-full px-4 py-2 bg-white border border-cute-lavender text-sm">
          <option>NIFTY</option>
          <option>BANKNIFTY</option>
          <option>FINNIFTY</option>
        </select>
        <button id="refresh" class="rounded-full px-5 py-2 bg-cute-pink text-white font-medium hover:bg-pink-400 transition">
          Refresh
        </button>
      </div>
    </header>

    <!-- Market Pulse -->
    <section id="pulse" class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-6">
      <div class="bg-white rounded-2xl p-4 card-shadow">
        <div class="text-xs text-slate-500">NIFTY 50</div>
        <div id="nifty-val" class="text-2xl font-semibold">—</div>
        <div id="nifty-chg" class="text-sm">—</div>
      </div>
      <div class="bg-white rounded-2xl p-4 card-shadow">
        <div class="text-xs text-slate-500">BANK NIFTY</div>
        <div id="bank-val" class="text-2xl font-semibold">—</div>
        <div id="bank-chg" class="text-sm">—</div>
      </div>
      <div class="bg-white rounded-2xl p-4 card-shadow">
        <div class="text-xs text-slate-500">INDIA VIX</div>
        <div id="vix-val" class="text-2xl font-semibold">—</div>
        <div id="regime" class="text-sm font-medium">—</div>
      </div>
      <div class="bg-white rounded-2xl p-4 card-shadow flex items-center justify-center">
        <div class="text-center">
          <div class="text-xs text-slate-500">Feed</div>
          <div id="feed-status" class="text-sm font-medium text-cute-mint">Connecting…</div>
        </div>
      </div>
    </section>

    <!-- Price + VWAP / EMAs Chart -->
    <section class="mb-6">
      <h2 class="text-lg font-semibold mb-3">Price · VWAP · EMAs</h2>
      <div class="bg-white rounded-2xl p-4 card-shadow">
        <div id="price-chart" class="w-full h-80"></div>
        <p id="price-meta" class="text-xs text-slate-400 mt-2 text-center">Loading price…</p>
      </div>
    </section>

    <!-- OI Walls Chart -->
    <section class="mb-6">
      <h2 class="text-lg font-semibold mb-3">OI Walls by Strike</h2>
      <div class="bg-white rounded-2xl p-4 card-shadow">
        <div id="oi-chart" class="w-full h-80"></div>
        <p id="chart-meta" class="text-xs text-slate-400 mt-2 text-center">Loading chain…</p>
      </div>
    </section>

    <!-- Cue Cards Feed -->
    <section>
      <h2 class="text-lg font-semibold mb-3">Cue Cards</h2>
      <div id="cards" class="space-y-4">
        <div class="bg-white rounded-2xl p-8 text-center card-shadow text-slate-500">
          Loading live confluence…
        </div>
      </div>
    </section>

    <!-- Position Sizing (simple) -->
    <section class="mt-8 bg-white rounded-2xl p-5 card-shadow">
      <h3 class="font-semibold mb-3">Position Sizing</h3>
      <div class="flex flex-wrap gap-3 items-end">
        <div>
          <label class="text-xs text-slate-500">Capital (₹)</label>
          <input id="capital" type="number" value="500000" class="block rounded-lg border px-3 py-2 w-36" />
        </div>
        <div>
          <label class="text-xs text-slate-500">Risk %</label>
          <input id="risk" type="number" value="1.5" step="0.1" class="block rounded-lg border px-3 py-2 w-24" />
        </div>
        <div class="text-sm">
          Max risk per trade: <span id="max-risk" class="font-semibold text-cute-pink">₹7,500</span>
        </div>
      </div>
    </section>
  </div>

  <script>
    const API = ""; // same-origin when served by FastAPI; set to "http://localhost:8000" if opening file directly

    let oiChart, putSeries, callSeries;
    let priceChart, candleSeries, vwapSeries, ema5Series, ema20Series;

    function initCharts() {
      // OI chart — use synthetic timestamps + custom tick formatter for strikes
      const oiContainer = document.getElementById("oi-chart");
      oiChart = LightweightCharts.createChart(oiContainer, {
        layout: { background: { color: "#ffffff" }, textColor: "#1e1b4b" },
        grid: { vertLines: { color: "#f1f5f9" }, horzLines: { color: "#f1f5f9" } },
        rightPriceScale: { borderColor: "#e2e8f0" },
        timeScale: {
          borderColor: "#e2e8f0",
          tickMarkFormatter: (time) => {
            // time is our synthetic index; look up strike if available
            if (window._oiStrikes && window._oiStrikes[time]) {
              return window._oiStrikes[time].toLocaleString("en-IN");
            }
            return "";
          },
        },
        height: 320,
      });
      putSeries = oiChart.addHistogramSeries({
        color: "#6ee7b7",
        priceFormat: { type: "volume" },
        title: "Put OI",
      });
      callSeries = oiChart.addHistogramSeries({
        color: "#ff8fb1",
        priceFormat: { type: "volume" },
        title: "Call OI",
      });

      // Price chart
      const priceContainer = document.getElementById("price-chart");
      priceChart = LightweightCharts.createChart(priceContainer, {
        layout: { background: { color: "#ffffff" }, textColor: "#1e1b4b" },
        grid: { vertLines: { color: "#f1f5f9" }, horzLines: { color: "#f1f5f9" } },
        rightPriceScale: { borderColor: "#e2e8f0" },
        timeScale: { borderColor: "#e2e8f0", timeVisible: true, secondsVisible: false },
        height: 320,
      });
      candleSeries = priceChart.addCandlestickSeries({
        upColor: "#6ee7b7",
        downColor: "#ff8fb1",
        borderUpColor: "#6ee7b7",
        borderDownColor: "#ff8fb1",
        wickUpColor: "#6ee7b7",
        wickDownColor: "#ff8fb1",
      });
      vwapSeries = priceChart.addLineSeries({ color: "#c4b5fd", lineWidth: 2, title: "VWAP" });
      ema5Series = priceChart.addLineSeries({ color: "#f59e0b", lineWidth: 1, title: "EMA 5" });
      ema20Series = priceChart.addLineSeries({ color: "#3b82f6", lineWidth: 1, title: "EMA 20" });

      window.addEventListener("resize", () => {
        if (oiChart) oiChart.applyOptions({ width: oiContainer.clientWidth });
        if (priceChart) priceChart.applyOptions({ width: priceContainer.clientWidth });
      });
    }

    function computeEMAs(candles, period) {
      const k = 2 / (period + 1);
      let ema = candles[0].close;
      return candles.map(c => {
        ema = c.close * k + ema * (1 - k);
        return { time: c.time, value: ema };
      });
    }

    function computeVWAP(candles) {
      let cumVol = 0, cumTPV = 0;
      return candles.map(c => {
        const tp = (c.high + c.low + c.close) / 3;
        cumVol += c.volume;
        cumTPV += tp * c.volume;
        return { time: c.time, value: cumTPV / cumVol };
      });
    }

    async function loadPriceChart(symbol) {
      try {
        const res = await fetch(`${API}/api/candles?symbol=${symbol}&bars=80`);
        const data = await res.json();
        if (!data.candles || data.candles.length === 0) {
          document.getElementById("price-meta").textContent = "No candle data";
          return;
        }
        const candles = data.candles;
        candleSeries.setData(candles);
        vwapSeries.setData(computeVWAP(candles));
        ema5Series.setData(computeEMAs(candles, 5));
        ema20Series.setData(computeEMAs(candles, 20));
        document.getElementById("price-meta").textContent =
          `${symbol} · Spot ${fmt(data.spot)} · ${candles.length} bars (demo until real OHLCV feed)`;
        priceChart.timeScale().fitContent();
      } catch (e) {
        document.getElementById("price-meta").textContent = "Price chart unavailable";
      }
    }

    async function loadOIChart(symbol) {
      try {
        const res = await fetch(`${API}/api/chain?symbol=${symbol}`);
        const data = await res.json();
        if (!data.records || data.records.length === 0) {
          document.getElementById("chart-meta").textContent = "No chain data";
          return;
        }
        const records = data.records;
        // Synthetic ascending timestamps so Lightweight Charts accepts the data
        // Store strikes for the tick formatter
        window._oiStrikes = {};
        const baseTime = Math.floor(Date.now() / 1000) - records.length * 60;
        const putData = records.map((r, i) => {
          const t = baseTime + i * 60;
          window._oiStrikes[t] = r.strike;
          return { time: t, value: Number(r.put_oi) || 0 };
        });
        const callData = records.map((r, i) => {
          const t = baseTime + i * 60;
          return { time: t, value: Number(r.call_oi) || 0 };
        });

        putSeries.setData(putData);
        callSeries.setData(callData);

        // Highlight approximate ATM / spot by finding closest strike
        // (spot comes from card or pulse; we approximate from data if needed)
        const strikes = records.map(r => r.strike);
        document.getElementById("chart-meta").textContent =
          `${symbol} · ${data.expiry || "nearest"} · ${records.length} strikes · Put wall & Call wall highlighted by height`;

        oiChart.timeScale().fitContent();
      } catch (e) {
        document.getElementById("chart-meta").textContent = "Chart data unavailable";
      }
    }

    function fmt(n) {
      if (n == null) return "—";
      return Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });
    }

    function chgClass(v) {
      if (v == null) return "";
      return v >= 0 ? "text-emerald-600" : "text-rose-600";
    }

    async function loadPulse() {
      try {
        const res = await fetch(`${API}/api/pulse`);
        const d = await res.json();
        if (d.nifty) {
          document.getElementById("nifty-val").textContent = fmt(d.nifty.last);
          const c = d.nifty.pChange;
          document.getElementById("nifty-chg").innerHTML =
            `<span class="${chgClass(c)}">${c >= 0 ? "+" : ""}${fmt(c)}%</span>`;
        }
        if (d.banknifty) {
          document.getElementById("bank-val").textContent = fmt(d.banknifty.last);
          const c = d.banknifty.pChange;
          document.getElementById("bank-chg").innerHTML =
            `<span class="${chgClass(c)}">${c >= 0 ? "+" : ""}${fmt(c)}%</span>`;
        }
        if (d.vix) {
          document.getElementById("vix-val").textContent = fmt(d.vix.last);
        }
        const regimeEl = document.getElementById("regime");
        if (d.regime === "credit_friendly") {
          regimeEl.textContent = "Credit-Friendly";
          regimeEl.className = "text-sm font-medium text-orange-500";
        } else {
          regimeEl.textContent = "Debit-Friendly";
          regimeEl.className = "text-sm font-medium text-sky-600";
        }
        document.getElementById("feed-status").textContent = "NSE Live";
        document.getElementById("feed-status").className = "text-sm font-medium text-cute-mint";
      } catch (e) {
        document.getElementById("feed-status").textContent = "Offline / Error";
        document.getElementById("feed-status").className = "text-sm font-medium text-rose-500";
      }
    }

    function renderCard(card) {
      const container = document.getElementById("cards");
      if (!card || card.status === "error") {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-6 card-shadow text-center text-rose-500">
            ${card?.reason || "Failed to load card"}
          </div>`;
        return;
      }
      if (card.status === "silence") {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 card-shadow text-center">
            <div class="text-4xl mb-2">🤫</div>
            <h3 class="text-xl font-semibold text-cute-lavender">Market Silence — Capital Protected</h3>
            <p class="mt-2 text-slate-600">${card.reason || "Pillars did not fully align"}</p>
            <p class="mt-1 text-xs text-slate-400">Pillar failed: ${card.pillar_failed || "matrix"}</p>
          </div>`;
        return;
      }
      // Signal card
      const why = (card.why || []).map(w => `<li class="ml-4 list-disc">${w}</li>`).join("");
      const legs = (card.legs || []).map(l =>
        `<span class="inline-block bg-cute-cream rounded-full px-3 py-1 text-xs mr-1 mb-1">
          ${l.action.toUpperCase()} ${l.strike} ${l.type}
        </span>`
      ).join("");
      container.innerHTML = `
        <div class="bg-white rounded-2xl p-6 card-shadow border-l-4 border-cute-pink">
          <div class="flex justify-between items-start">
            <div>
              <div class="text-xs text-slate-500">${card.symbol} · ${card.expiry || "nearest"}</div>
              <h3 class="text-xl font-bold">${card.strategy}</h3>
            </div>
            <div class="text-right">
              <div class="text-2xl font-semibold text-cute-pink">${card.confluence_score}/100</div>
              <div class="text-xs text-slate-500">Confluence</div>
            </div>
          </div>
          <div class="mt-4">
            <div class="text-xs font-medium text-slate-500 mb-1">Why</div>
            <ul class="text-sm space-y-1">${why}</ul>
          </div>
          <div class="mt-4">
            <div class="text-xs font-medium text-slate-500 mb-1">Legs (defined-risk)</div>
            <div>${legs}</div>
          </div>
          <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-2 text-sm">
            <div><span class="text-slate-500">Max Profit</span><br>${card.max_profit || "—"}</div>
            <div><span class="text-slate-500">Max Loss</span><br>${card.max_loss || "hard-capped"}</div>
            <div><span class="text-slate-500">Regime</span><br>${card.regime || "—"}</div>
            <div><span class="text-slate-500">Tape</span><br>${card.tape || "—"}</div>
          </div>
          ${card.meta ? `<div class="mt-3 text-xs text-slate-400">Spot ${fmt(card.meta.spot)} · VIX ${fmt(card.meta.vix)} · ${card.meta.fetched_at?.slice(11,19) || ""}</div>` : ""}
        </div>`;
    }

    async function loadCard() {
      const symbol = document.getElementById("symbol").value;
      document.getElementById("cards").innerHTML = `
        <div class="bg-white rounded-2xl p-8 text-center card-shadow text-slate-500">
          Refreshing ${symbol}…
        </div>`;
      try {
        const res = await fetch(`${API}/api/card?symbol=${symbol}&n_expiries=3`);
        const card = await res.json();
        renderCard(card);
      } catch (e) {
        renderCard({ status: "error", reason: "Cannot reach API. Is the server running on :8000?" });
      }
    }

    function updateSizing() {
      const cap = Number(document.getElementById("capital").value) || 0;
      const risk = Number(document.getElementById("risk").value) || 0;
      document.getElementById("max-risk").textContent = "₹" + Math.round(cap * risk / 100).toLocaleString("en-IN");
    }

    document.getElementById("refresh").addEventListener("click", () => {
      loadPulse();
      loadCard();
      loadOIChart(document.getElementById("symbol").value);
      loadPriceChart(document.getElementById("symbol").value);
    });
    document.getElementById("symbol").addEventListener("change", () => {
      loadCard();
      loadOIChart(document.getElementById("symbol").value);
      loadPriceChart(document.getElementById("symbol").value);
    });
    document.getElementById("capital").addEventListener("input", updateSizing);
    document.getElementById("risk").addEventListener("input", updateSizing);

    // Initial load
    initCharts();
    updateSizing();
    loadPulse();
    loadCard();
    loadOIChart(document.getElementById("symbol").value);
    loadPriceChart(document.getElementById("symbol").value);
    // Auto-refresh every 60s during market hours (simple)
    setInterval(() => { loadPulse(); loadCard(); loadOIChart(document.getElementById("symbol").value); loadPriceChart(document.getElementById("symbol").value); }, 60000);
  </script>
</body>
</html>
